name: Site bug
description: Report a broken page, layout issue, or site behavior problem.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private data, or security vulnerabilities in a public issue. Use the private security advisory link instead.
  - type: input
    id: url
    attributes:
      label: Affected page
      description: Paste the URL or repository path.
      placeholder: https://lin1chun.github.io/example/
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the visible problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Firefox 145 on Windows 11; Safari on iPhone 15
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Add screenshots, console output, or related context if useful.
