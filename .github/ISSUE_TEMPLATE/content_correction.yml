name: Content correction
description: Report a factual error, broken source, typo, or accessibility problem in an article.
title: "content: "
body:
  - type: input
    id: page
    attributes:
      label: Article URL
      placeholder: https://lin1chun.github.io/post/example/
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: What needs to change?
      description: Quote the affected passage and describe the correction.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Supporting source
      description: Link a primary source when the correction changes a factual claim.
  - type: checkboxes
    id: licensing
    attributes:
      label: Rights
      options:
        - label: I have permission to share any image or excerpt included in this report.
          required: true
