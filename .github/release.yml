changelog:
  categories:
    - title: Features
      labels:
        - feat
        - enhancement
    - title: Content
      labels:
        - content
    - title: Fixes
      labels:
        - fix
        - bug
    - title: Maintenance
      labels:
        - chore
        - ci
        - docs
        - refactor
        - perf
    - title: Dependencies
      labels:
        - dependencies
        - build
    - title: Other changes
      labels:
        - "*"
