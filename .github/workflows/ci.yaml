name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  HUGO_ENVIRONMENT: production
  HUGO_ENV: production

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository with theme
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Read pinned Hugo version
        id: hugo-version
        run: echo "version=$(<.hugo-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ steps.hugo-version.outputs.version }}
          extended: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        timeout-minutes: 3
        run: >-
          npm ci
          --prefer-offline
          --no-audit
          --no-fund
          --fetch-retries=2
          --fetch-retry-mintimeout=1000
          --fetch-retry-maxtimeout=5000
          --fetch-timeout=30000

      - name: Verify site
        run: npm run verify
